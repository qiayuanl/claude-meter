name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags give the build a version from git describe
      # Xcode 26.3 ships Swift 6.2.4, the toolchain the package is developed with.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app && swift --version
      - run: swift build -c release
      - run: make test
      - run: scripts/build-app.sh --zip
      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeMeter
          path: build/ClaudeMeter-*.zip*
          retention-days: 7
